name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests & APK bauen
        env:
          # Optional: Repository-Secret YOUTUBE_API_KEY bettet den Key direkt in die App ein.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk DnB-Radar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DnB-Radar-apk
          path: DnB-Radar.apk

      # Immer aktuelle APK als Release "latest" – bequem direkt am Handy herunterladbar.
      - name: Release "latest" aktualisieren
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DnB Radar (neuester Build)
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: DnB-Radar.apk
          body: |
            Neuester Build von `${{ github.ref_name }}` (${{ github.sha }}).
            APK auf dem Pixel herunterladen und installieren.

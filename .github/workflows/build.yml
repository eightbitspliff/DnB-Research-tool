name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests & APK bauen
        env:
          # Optional: Repository-Secret YOUTUBE_API_KEY bettet den Key direkt in die App ein.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug :flitz:assembleRelease

      - name: APK umbenennen
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DnB-Radar.apk
          cp flitz/build/outputs/apk/release/flitz-release.apk Flitz-Igel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DnB-Radar-apk
          path: DnB-Radar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Flitz-Igel-apk
          path: Flitz-Igel.apk

      # Immer aktuelle APK als Release "latest" – bequem direkt am Handy herunterladbar.
      - name: Release "latest" aktualisieren
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DnB Radar (neuester Build)
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: DnB-Radar.apk
          body: |
            Neuester Build von `${{ github.ref_name }}` (${{ github.sha }}).
            APK auf dem Pixel herunterladen und installieren.

      # Spiel "Flitz der Igel" als eigenes Release – APK direkt am Pixel herunterladen.
      - name: Release "flitz-latest" aktualisieren
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flitz-latest
          name: Flitz der Igel (neuester Build)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: Flitz-Igel.apk
          body: |
            Jump'n'Run mit Wischsteuerung, 15 Level. Neuester Build von `${{ github.ref_name }}` (${{ github.sha }}).
            `Flitz-Igel.apk` auf dem Pixel herunterladen und installieren.
